<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Photoshop App</title>

  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.3/lib/p5.min.js"></script>

  <style>
    body {
      margin: 0;
      background: white;
    }

    canvas {
      display: block;
    }
  </style>
</head>

<body>

<script>

let tool = 1;
let cnv;

function setup() {
  cnv = createCanvas(800, 800);
  background(255);

  // ✅ fixes keyboard input in iframe
  cnv.elt.tabIndex = "0";
  cnv.elt.focus();

  strokeWeight(1);
}

function draw() {
  if (mouseIsPressed) {

    if (tool === 1) {
      stroke(0);
      line(mouseX, mouseY, pmouseX, pmouseY);
    }

    else if (tool === 2) {
      noStroke();
      fill(0);
      rect(mouseX, mouseY, 40, 10);
    }

    else if (tool === 3) {
      noFill();
      stroke(255, 0, 0);
      ellipse(mouseX, mouseY, 50);
    }

    else if (tool === 4) {
      stroke(0, 150, 0);
      line(mouseX, mouseY, mouseX, mouseY - random(20, 50));
    }

    else if (tool === 5) {
      stroke(0, 0, 255);
      point(mouseX + random(-10, 10), mouseY + random(-10, 10));
    }

    else if (tool === 6) {
      stroke(200);
      line(mouseX, 0, mouseX, height);
      line(0, mouseY, width, mouseY);
    }

    else if (tool === 7) {
      stroke(255);
      strokeWeight(20);
      line(mouseX, mouseY, pmouseX, pmouseY);
      strokeWeight(1);
    }

    else if (tool === 8) {
      noStroke();
      fill(random(255), random(255), random(255));
      ellipse(mouseX + random(-20, 20), mouseY + random(-20, 20), 10);
    }

    else if (tool === 9) {
      fill(0);
      textSize(12);
      text("!", mouseX, mouseY);
    }

    else if (tool === 0) {
      background(255);
    }
  }
}

//  keyboard tool switching
function keyPressed() {
  if (key >= '0' && key <= '9') {
    tool = int(key);
  }
}

// optional: refocus canvas when clicked
function mousePressed() {
  cnv.elt.focus();
}

</script>

</body>
</html>
